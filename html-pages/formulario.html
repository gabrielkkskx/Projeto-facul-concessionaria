<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agende uma Visita</title>

    <link rel="shortcut icon" href="./img/whitecar.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');</style>
    <link href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../main.css">
    <link rel="stylesheet" href="./css/animate.css">

</head>
<body>

<div class="container-forms">
  <div class="form-box">
    <h2 class="title">Agende uma visita/Marque um TestDrive</h2>

    <form id="formAgendamento">
      <input type="text" name="name" id="name" placeholder="Seu nome" required>
      <input type="email" name="email" id="email" placeholder="Digite seu email" required>
      <input type="date" name="subject" id="subject" placeholder="Data que deseja agendar" required>

      <textarea name="message" id="message" placeholder="Observações adicionais"></textarea>

      <button type="submit" class="botao-destaque">Enviar</button>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById("formAgendamento");

  form.addEventListener("submit", function(event) {
    event.preventDefault(); // Evita o envio padrão

    const nome = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const data = document.getElementById("subject").value;
    const mensagem = document.getElementById("message").value;

    // Salva tudo no localStorage
    localStorage.setItem("nome", nome);
    localStorage.setItem("email", email);
    localStorage.setItem("data", data);
    localStorage.setItem("mensagem", mensagem);

    // Redireciona pra outra página
    window.location.href = "resultado.html";
  });
</script>


<script src="../js/main.js"></script>

</body>
</html>
